[tool.poetry]
name = "eirene-backend"
version = "0.1.0"
description = "Backend for Eirene Smart Fridge"
authors = ["Anastasia G. <oteratar18@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.100.0"
uvicorn = "^0.22.0"
sqlalchemy = "^2.0.0"
aiomysql = "^0.2.0"
alembic = "^1.11.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
cryptography = "^41.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
